<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Backend Engineering Journal</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirector
      // Converts 404 path to search query for index.html to decode
      var pathSegmentsToKeep = 1; // 1 for project repository subpath: /hari-engineering-journal/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
